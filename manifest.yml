# HeyBrief: talk to Jira, and Jira changes.
# app.id is a placeholder: `forge register` (Nov 10, on Ashref's machine) writes the real one.
modules:
  rovo:agent:
    - key: heybrief-agent
      name: HeyBrief
      icon: resource:static;icon.svg
      prompt: >
        You are HeyBrief, a hands-free assistant for Jira and Confluence.
        Answers are spoken aloud, so keep them under 60 words and read the
        "speech" field of each action result as is.

        Use my-day for "what's on my plate" or a morning brief. Use risk-radar
        for risks or "what's at risk". Use explain-risk when the user asks
        "why?" after a risk. Use voice-standup when the user reports status on
        issues (done, blocked, starting). Use urgent-alerts when the user asks
        what is urgent, on fire, or for alerts: say the confidence it reports,
        and if it says keywords only, tell the user to verify. Use read-issue
        for one issue and search-docs for Confluence pages.

        WRITE SAFETY, ALWAYS: voice-standup and risk-radar never change Jira
        themselves. When a result has needs_confirmation true, show its speech
        and STOP. Call confirm-change only after the user's own next message
        says yes, passing that message verbatim as user_reply and the
        confirmation_id from the result. Never confirm on the user's behalf,
        never reuse an old confirmation_id, and if the user says anything else,
        tell them nothing was changed.

        Reply in the user's language: English, French, or Modern Standard
        Arabic.
      conversationStarters:
        - What's on my plate today?
        - What's at risk this week?
        - Anything urgent right now?
        - I finished MP-12, MP-15 is blocked on legal, I'll pick up MP-9
        - Qu'est-ce qui est en retard ?
      actions:
        - my-day
        - read-issue
        - search-docs
        - voice-standup
        - risk-radar
        - explain-risk
        - urgent-alerts
        - confirm-change

  action:
    - key: my-day
      name: My day
      function: my-day-fn
      actionVerb: GET
      description: The user's day in under 60 spoken words, sized to their drive time
        if minutes is given, with at most one decision.
      inputs:
        minutes:
          title: Minutes available
          type: integer
          required: false
          description: Drive or free time in minutes. Fits the brief to it.
        language:
          title: Language
          type: string
          required: false
          description: en, fr or ar. Defaults to the language of the request.
    - key: read-issue
      name: Read issue
      function: read-issue-fn
      actionVerb: GET
      description: Read one Jira issue aloud (summary, status, assignee, due date).
      inputs:
        issue_key:
          title: Issue key
          type: string
          required: true
          description: Jira issue key such as MP-12.
    - key: search-docs
      name: Search docs
      function: search-docs-fn
      actionVerb: GET
      description: Search Confluence pages and read the best match.
      inputs:
        query:
          title: Query
          type: string
          required: true
          description: What to look for.
    - key: voice-standup
      name: Voice standup
      function: voice-standup-fn
      actionVerb: UPDATE
      description: >
        Turn a spoken status update covering several issues into Jira changes
        (transitions, blocker links, comments, owner notification, Confluence
        standup note). Proposes only; returns a read-back and a confirmation_id.
        Nothing is written until confirm-change.
      inputs:
        update:
          title: Spoken update
          type: string
          required: true
          description: The user's words, verbatim.
        language:
          title: Language
          type: string
          required: false
          description: en, fr or ar.
    - key: risk-radar
      name: Risk Radar
      function: risk-radar-fn
      actionVerb: GET
      description: >
        Up to three delivery risks from deterministic Jira rules, each with
        evidence issues, a confirmed or estimated label, and one proposed fix
        (returned with a confirmation_id).
      inputs:
        scope:
          title: Scope
          type: string
          required: false
          description: 'me (default), a project key like MP, or an epic key like MP-40.'
        language:
          title: Language
          type: string
          required: false
          description: en, fr or ar.
    - key: explain-risk
      name: Explain risk
      function: explain-risk-fn
      actionVerb: GET
      description: Answer "why?" about a risk from the last radar run, naming the
        issues and the rule that fired.
      inputs:
        rank:
          title: Risk number
          type: integer
          required: false
          description: 1 for the top risk (default), 2 or 3.
    - key: urgent-alerts
      name: Urgent alerts
      function: urgent-alerts-fn
      actionVerb: GET
      description: >
        The most urgent Jira event now (unowned P1 incident, security issue,
        blocker hitting a deadline, P1 due today), with confidence, evidence and
        one proposed action plus a confirmation_id. Nothing is written until
        confirm-change.
      inputs:
        language:
          title: Language
          type: string
          required: false
          description: en, fr or ar.
    - key: confirm-change
      name: Confirm change
      function: confirm-change-fn
      actionVerb: UPDATE
      description: >
        Apply a proposed change ONLY after the user explicitly said yes in their
        own message. Expires 2 minutes after the proposal. Any reply other than
        yes cancels it.
      inputs:
        confirmation_id:
          title: Confirmation id
          type: string
          required: true
          description: The confirmation_id from voice-standup, risk-radar, urgent-alerts
            or my-day.
        user_reply:
          title: User reply
          type: string
          required: true
          description: The user's latest message, verbatim.

  rovo:mcp:
    - key: heybrief-mcp
      name: HeyBrief
      tools:
        - my-day
        - read-issue
        - search-docs
        - voice-standup
        - risk-radar
        - explain-risk
        - urgent-alerts
        - confirm-change

  jira:globalPage:
    - key: heybrief-voice
      title: HeyBrief
      icon: resource:static;icon.svg
      resource: voice
      resolver:
        function: ui-resolver-fn

  jira:dashboardGadget:
    - key: drive-receipt
      title: HeyBrief receipt
      description: What you said and approved by voice, with undo, plus Risk Radar.
      thumbnail: resource:static;icon.svg
      resource: gadget
      render: native
      resolver:
        function: ui-resolver-fn

  jira:personalSettingsPage:
    - key: heybrief-settings
      title: HeyBrief
      resource: settings
      render: native
      resolver:
        function: ui-resolver-fn

  llm:
    - key: heybrief-llm
      model:
        - claude

  function:
    - key: my-day-fn
      handler: index.myDay
    - key: read-issue-fn
      handler: index.readIssue
    - key: search-docs-fn
      handler: index.searchDocsAction
    - key: voice-standup-fn
      handler: index.voiceStandup
    - key: risk-radar-fn
      handler: index.riskRadar
    - key: explain-risk-fn
      handler: index.explainRisk
    - key: urgent-alerts-fn
      handler: index.urgentAlerts
    - key: confirm-change-fn
      handler: index.confirmChange
    - key: ui-resolver-fn
      handler: index.uiResolver

resources:
  - key: gadget
    path: src/frontend/gadget.tsx
  - key: settings
    path: src/frontend/settings.tsx
  - key: voice
    path: static/voice/build
  - key: static
    path: static

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
    - search:confluence
    - read:confluence-content.summary
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence

app:
  id: ari:cloud:ecosystem::app/97ce7671-faa4-49b0-9eb4-30f946f590c9
  runtime:
    name: nodejs22.x
